[project]
name = "workspace-statistics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GREGORIO AARON MEZA RAMOS", email = "aaronmr01@ciencias.unam.mx" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
workspace-statistics = "workspace_statistics:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
